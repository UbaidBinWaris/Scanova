# PostgreSQL 18 for Scanova — one instance, two databases (main and key
# database, docs/ARCHITECTURE.md §6). Sized for the 2 GB container cap on the
# 16 GB target server.

# ── Connections ───────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 60
unix_socket_directories = '/var/run/postgresql'

# ── Authentication and TLS ────────────────────────────────────────────
# TCP is TLS-only (pg_hba.conf) and passwords are SCRAM-SHA-256 only.
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/scanova/tls/postgres.crt'
ssl_key_file = '/etc/scanova/tls/postgres.key'
ssl_min_protocol_version = 'TLSv1.3'

# ── Memory ────────────────────────────────────────────────────────────
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB
huge_pages = off
jit = off

# ── WAL and checkpoints ───────────────────────────────────────────────
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# ── Planner (NVMe) ────────────────────────────────────────────────────
random_page_cost = 1.1

# ── Safety nets ───────────────────────────────────────────────────────
idle_in_transaction_session_timeout = '10min'

# ── Logging ───────────────────────────────────────────────────────────
# To the container's stderr. Statements and bind parameters are never
# logged, not even for failed or slow queries: parameters carry password
# hashes, token hashes and lookup indexes.
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'none'
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_lock_waits = on
log_timezone = 'UTC'

# ── Locale ────────────────────────────────────────────────────────────
timezone = 'UTC'
