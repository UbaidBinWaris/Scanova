# PostgreSQL client authentication for Scanova. First matching line wins.
#
# - The superuser exists only on the unix socket inside the container
#   (`docker compose exec postgres psql -U postgres`), never on the network.
# - Every network connection must use TLS and SCRAM-SHA-256.
# - Which role may enter which database is decided by CONNECT privileges
#   (infra/postgres/provision-database.sql), so role names stay configurable.
#
# TYPE      DATABASE  USER      ADDRESS  METHOD
local       all       postgres           peer
hostssl     all       postgres  all      reject
hostssl     all       all       all      scram-sha-256
hostnossl   all       all       all      reject
