# Dependabot (docs/SECURITY-TESTING.md): weekly update pull requests, grouped so
# one PR per ecosystem arrives instead of dozens. Security updates are not held
# back by the grouping. Every PR runs CI and the security workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Matches pnpm-workspace.yaml (minimumReleaseAge): only versions a day old.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      android-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # The pinned node base image (tag and digest) of the server images.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ['*']
