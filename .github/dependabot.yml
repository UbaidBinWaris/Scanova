# Dependabot (docs/SECURITY-TESTING.md): weekly update pull requests, grouped so
# one PR per ecosystem arrives instead of dozens. Every PR runs CI and the
# security workflows.
#
# Cooldown: a version must be a week old before Dependabot proposes it, so a
# hijacked release is usually caught and pulled first. It only holds back
# version updates: security updates still arrive at once. (pnpm's own floor,
# minimumReleaseAge in pnpm-workspace.yaml, is one day.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Major versions that are migrations, not bumps (first proposed 2026-11-16,
    # both failed CI). Remove an entry when that migration is taken on.
    ignore:
      # Tailwind 4 moves the PostCSS plugin to @tailwindcss/postcss and the config
      # into CSS; the web app is built on Tailwind 3.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 7 yet ("typescript-eslint
      # does not support TS 7.0"); revisit once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      android-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The pinned base images (tag and digest) of the server images.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/web
      - /apps/ai-image
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ['*']

  # The page clean-up runtime's Python dependencies (apps/ai-image/requirements.txt,
  # hash-pinned; regenerate with the command in requirements.in).
  - package-ecosystem: pip
    directory: /apps/ai-image
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      ai-image:
        patterns: ['*']
