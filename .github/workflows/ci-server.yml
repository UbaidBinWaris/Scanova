# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci-server.yml — checks for the server (reusable)
#
# Called by ci.yml (pull requests, other branches) and by deploy.yml before a
# release ships. Install, format, typecheck, lint, unit tests, build, then the
# integration tests against real PostgreSQL, OpenBao and Garage (a throwaway
# Compose stack on the runner).
#
# A workflow of its own (instead of a switch in ci.yml) so a caller only gets
# the checks it needs, and none show up as "skipped".
# ──────────────────────────────────────────────────────────────────────────────

name: Server checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version: package.json "packageManager")

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck, lint, unit tests, build
        run: pnpm turbo run typecheck lint test build

      # The AI evaluation runner's own tests. Standard library only (it runs inside the
      # worker image, where nothing can be installed), so it needs no setup step.
      - name: AI evaluation self-test
        run: python3 -I tools/ai-eval/aieval.py selftest

      - name: Integration tests
        run: pnpm test:integration
