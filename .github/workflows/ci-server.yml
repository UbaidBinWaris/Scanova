# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci-server.yml — checks for the server (reusable)
#
# Called by ci.yml (pull requests, other branches) and by deploy.yml before a
# release ships. Install, format, typecheck, lint, unit tests, build, then the
# integration tests against real PostgreSQL, OpenBao and Garage (a throwaway
# Compose stack on the runner).
#
# A workflow of its own (instead of a switch in ci.yml) so a caller only gets
# the checks it needs, and none show up as "skipped".
# ──────────────────────────────────────────────────────────────────────────────

name: Server checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck, lint, unit tests, build
        run: pnpm turbo run typecheck lint test build

      - name: Integration tests
        run: pnpm test:integration
