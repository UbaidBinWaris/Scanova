# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci-android.yml — checks for the Android app (reusable)
#
# Called by ci.yml (pull requests, other branches) and by android-release.yml
# before a build is signed and published: debug build, unit tests, lint.
#
# A workflow of its own (instead of a switch in ci.yml) so a caller only gets
# the checks it needs, and none show up as "skipped".
# ──────────────────────────────────────────────────────────────────────────────

name: Android checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Lint and test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-${{ github.run_id }}
          path: |
            apps/android/**/build/reports/
          retention-days: 7
