# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml — checks for the server and the Android app
#
# Runs on pull requests and on pushes to branches other than main. On main the
# deploy workflows run only the checks they need before they ship anything:
#   deploy.yml           → ci-server.yml
#   android-release.yml  → ci-android.yml
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server
    uses: ./.github/workflows/ci-server.yml

  android:
    name: Android
    uses: ./.github/workflows/ci-android.yml
