# Throwaway services for integration tests. Nothing here is for production:
# data lives in tmpfs, OpenBao runs in dev mode, and every credential is a
# well-known test value. Started and torn down by run.mjs.
#
# Host ports (127.0.0.1 only): PostgreSQL 56432, OpenBao 56200, Garage S3 56900.
name: scanova-test

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: scanova-test-superuser
    # The server key must be owned by the postgres user, which a bind mount cannot
    # guarantee, so the certificate is copied into place before the server starts.
    entrypoint:
      - sh
      - -c
      - |
        cp /pki/server.crt /pki/server.key /tmp/ &&
        chown postgres:postgres /tmp/server.crt /tmp/server.key &&
        chmod 600 /tmp/server.key &&
        exec docker-entrypoint.sh postgres \
          -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key \
          -c fsync=off -c max_connections=200
    volumes:
      - ${SCANOVA_TEST_PKI_DIR:?set by run.mjs}:/pki:ro
    tmpfs:
      - /var/lib/postgresql
    ports:
      - 127.0.0.1:56432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  openbao:
    image: openbao/openbao:2.7.2
    command: ['server', '-dev', '-dev-root-token-id=scanova-test-root', '-dev-listen-address=0.0.0.0:8200']
    environment:
      SKIP_SETCAP: 'true'
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - 127.0.0.1:56200:8200
    healthcheck:
      test: ['CMD', 'bao', 'status', '-address=http://127.0.0.1:8200']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  garage:
    image: dxflrs/garage:v2.5.0
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage
    ports:
      - 127.0.0.1:56900:3900
    mem_limit: 512m
